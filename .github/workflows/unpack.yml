name: Finalize portfolio repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove transfer metadata and temporary workflow
        run: |
          find . -type f -name '._*' -delete
          rm .github/workflows/unpack.yml
      - name: Commit clean repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove transfer metadata [skip ci]"
          git push
